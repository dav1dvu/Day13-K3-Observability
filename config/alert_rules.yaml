alerts:
  - name: HighLatency_P95
    severity: high
    condition: latency_p95 > 3000ms
    type: symptom-based
    owner: dat_sre
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: error_rate_pct > 2
    type: symptom-based
    owner: dat_sre
    runbook: docs/alerts.md#alert-2
  - name: LowResponseQuality
    severity: medium
    condition: quality_score_mean < 0.75
    type: symptom-based
    owner: dat_sre
    runbook: docs/alerts.md#alert-3
